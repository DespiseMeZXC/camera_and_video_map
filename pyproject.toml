[tool.poetry]
name = "camera-and-video-map"
version = "0.1.0"
description = ""
authors = ["Alecsey Shitiy <2003lesha2003@mail.ru>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = "^0.34.2"
fastapi = "^0.115.12"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.27"}
asyncpg = "^0.29.0"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.2.1"
alembic = "^1.13.1"
pydantic = {extras = ["email"], version = "^2.11.5"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
black = "^24.2.0"
pre-commit = "^3.6.0"

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "scripts.main:start"
makemigrations = "scripts.main:makemigrations"
migrate = "scripts.main:migrate"
